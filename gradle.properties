org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ⚠️ 本文件会提交到仓库，不要在此写机器相关路径：
#   - 本机 JDK 路径  → 放用户级 ~/.gradle/gradle.properties 的 org.gradle.java.home
#   - Android SDK    → 放 local.properties 的 sdk.dir（已在 .gitignore 中）
# CI 两者都不需要：setup-java 提供 JDK，runner 自带 Android SDK 并已设 ANDROID_HOME。
#
# （曾经这里写死 org.gradle.java.home=/home/orlando/jdk17，导致 CI 上
#   Gradle 因「Java home 路径无效」直接启动失败——本机路径不该进仓库。）
