name: Android 构建

# 推送到 main、提交 PR，或在 Actions 页面手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次仍在跑的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # GitHub runner 在海外：改用官方 Maven 源（本地的阿里云镜像反而慢）
      GRADLE_USE_MIRRORS: 'false'
      # 是否已配置签名密钥（决定 release APK 能否签名）
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 把 keystore 以 base64 存进仓库 Secret，避免把签名密钥提交进仓库。
      # 需要 4 个 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 写入 release 签名密钥
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > dingwei-release.jks
          {
            echo "storeFile=dingwei-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "✅ 已配置 release 签名密钥，release APK 将签名"

      - name: 未配置密钥则给出提示
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::未配置 KEYSTORE_BASE64 secret，release APK 将是未签名包（无法直接安装）。"
          echo "本次仍会产出可直接安装的 debug APK。"

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint 检查
        run: ./gradlew lintDebug --stacktrace

      - name: 构建 APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dingwei-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
